[project]
name = "siglo-bi"
version = "0.1.0"
description = "SIGLO BI — FastAPI + ETL (dados pseudonimizados, sem PII)"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
